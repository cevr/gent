name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    # The build targets darwin-arm64 only (apps/tui/scripts/build.ts, the gent-cell compile).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Gate
        run: bun run gate

      - name: E2E
        run: bun run test:e2e
