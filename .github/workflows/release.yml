name: Release

# A tag `v<version>` builds the gent and gent-cell pair on each platform's own
# runner, runs the release smoke on it, and drafts a GitHub release with one
# archive per platform, their SHA256SUMS and install.sh. The owner checks the
# draft and publishes it; install.sh and `gent upgrade` read published
# releases only.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Each runner builds its own platform: `bun install` puts that
          # platform's OpenTUI and fff libraries on disk, and the build embeds
          # them. x64 embeds Bun's baseline runtime, which runs without AVX2.
          - platform: darwin-arm64
            runner: macos-15
            target: bun-darwin-arm64
          - platform: darwin-x64
            runner: macos-15-intel
            target: bun-darwin-x64-baseline
          - platform: linux-x64
            runner: ubuntu-24.04
            target: bun-linux-x64-baseline
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pinned Bun builds the bytecode, and each binary embeds that Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: The tag names the version apps/tui/package.json holds
        run: |
          version="$(jq -r .version apps/tui/package.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but apps/tui/package.json holds $version" >&2
            exit 1
          fi

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          GENT_COMPILE_TARGET: ${{ matrix.target }}

      # arm64 macOS runs only signed code; an ad-hoc signature is enough for a
      # file curl downloads, which carries no quarantine flag.
      - name: Sign
        if: startsWith(matrix.platform, 'darwin')
        run: codesign --force --sign - apps/tui/bin/gent apps/tui/bin/gent-cell

      - name: Smoke
        run: bun packages/e2e/src/release-smoke.ts apps/tui/bin

      - name: Pack
        run: tar -czf "gent-${{ matrix.platform }}.tar.gz" -C apps/tui/bin gent gent-cell

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gent-${{ matrix.platform }}
          path: gent-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    name: Draft the release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # install.sh ships with the release it installs: the site serves the
      # latest release's copy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: install.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: gent-*
          merge-multiple: true
          path: dist

      # SHA256SUMS names install.sh too: `gent upgrade` checks it like any
      # other asset before it runs it.
      - name: Installer
        run: cp install.sh dist/install.sh

      - name: Checksums
        working-directory: dist
        run: sha256sum gent-*.tar.gz install.sh > SHA256SUMS

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/*
