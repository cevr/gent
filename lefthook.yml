pre-commit:
  parallel: false
  jobs:
    # First, and alone: the guards read the tree and finish in seconds,
    # so their verdict heads the output instead of sitting after the
    # minutes the later jobs take. Every job still runs -- lefthook does not
    # stop at the first failure -- so this buys the reader the answer early,
    # not a shorter run. The formatter runs after, so nothing the guards read
    # has been rewritten under them.
    - name: guards
      run: bun run guards
    # `lint:fix` is oxlint alone; the guards above and the offs check below
    # are the other parts of `bun run lint`, which the gate runs as one
    # command.
    - name: lint+fmt
      run: bun run lint:fix && bun run fmt
      stage_fixed: true
    - name: typecheck
      run: bun run typecheck
    - name: build
      run: bun run build
    # After every job that writes: the offs check and the tests only read the
    # tree, so they run side by side. The offs check lints the tree as it will
    # be committed: every "off" in `.oxlintrc.json` still suppresses a
    # diagnostic.
    - name: read-only checks
      group:
        parallel: true
        jobs:
          - name: lint-offs
            run: bun run lint:offs
          - name: test
            run: bun run test
