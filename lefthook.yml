pre-commit:
  parallel: false
  jobs:
    # First, and alone: the guards read the tree and finish in about two
    # seconds, so their verdict heads the output instead of sitting after the
    # minutes the later jobs take. Every job still runs -- lefthook does not
    # stop at the first failure -- so this buys the reader the answer early,
    # not a shorter run. The formatter runs after, so nothing the guards read
    # has been rewritten under them.
    - name: guards
      run: bun run guards
    # `lint:fix` is oxlint alone; the guards above and the offs check below
    # are the other parts of `bun run lint`, which the gate runs as one
    # command.
    - name: lint+fmt
      run: bun run lint:fix && bun run fmt
      stage_fixed: true
    # After the fixes: every "off" in `.oxlintrc.json` still suppresses a
    # diagnostic in the tree as it will be committed.
    - name: lint-offs
      run: bun run lint:offs
    - name: typecheck
      run: bun run typecheck
    - name: build
      run: bun run build
    - name: test
      run: bun run test
