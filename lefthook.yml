# The pre-commit hook finishes in under 10 s: it reads the staged files only.
# Typecheck, build, the whole-tree lint and the tests are `bun run gate`'s,
# which CI runs on every push and pull request; run it before a handoff.
pre-commit:
  parallel: true
  jobs:
    # The guards read the index the commit is made from, in about 2 s. They
    # run beside the fixers: a fix the fixers stage is formatting or an
    # oxlint autofix, and the gate reads the committed tree again.
    - name: guards
      run: bun run guards
    # oxlint first, then the formatter, on the same staged files, so the
    # formatter has the last word; each stages what it rewrote. oxlint and
    # oxfmt check a path named on the command line even when
    # `.oxlintignore` lists it, so the group excludes the rule fixtures here;
    # an `.invalid` fixture breaks its rule on purpose.
    - name: lint+fmt
      exclude:
        - "packages/tooling/fixtures/**"
      group:
        piped: true
        jobs:
          - name: oxlint
            glob: "*.{ts,tsx}"
            run: env -u FORCE_COLOR NO_COLOR=1 bunx oxlint --ignore-path=.oxlintignore --report-unused-disable-directives-severity=error --no-error-on-unmatched-pattern --fix {staged_files}
            stage_fixed: true
          - name: oxfmt
            run: env -u FORCE_COLOR NO_COLOR=1 bunx oxfmt --ignore-path=.oxlintignore --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
