# Typecheck only: the red tests are the open tasks, so a whole-suite run
# would fail every unit's merge for another unit's task. Each unit's tests
# run in its own gate.
name: gate
on: push
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
